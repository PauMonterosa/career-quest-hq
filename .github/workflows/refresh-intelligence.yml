name: Refresh agent intelligence

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "./backend[dev]"
      - run: python backend/scripts/refresh_intelligence.py
      - name: Commit new evidence
        run: |
          git config user.name "Career Quest Agents"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/public/data/intelligence.json
          git diff --cached --quiet || git commit -m "Update agent intelligence feed"
          git push

  publish:
    needs: research
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build:pages
        working-directory: frontend
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - name: Deploy refreshed intelligence
        id: deployment
        uses: actions/deploy-pages@v4
