name: Refresh agent intelligence

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "./backend[dev]"
      - run: python backend/scripts/refresh_intelligence.py
      - name: Commit new evidence
        run: |
          git config user.name "Career Quest Agents"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/public/data/intelligence.json
          git diff --cached --quiet || git commit -m "Update agent intelligence feed"
          git push
